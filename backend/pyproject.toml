[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "open-bim-platform"
version = "0.1.0"
description = "ISO 19650-compliant BIM Information Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "sqlalchemy[asyncio]>=2.0.0,<3.0",
    "asyncpg>=0.29.0,<1.0",
    "alembic>=1.13.0,<2.0",
    "pydantic[email]>=2.7.0,<3.0",
    "pydantic-settings>=2.3.0,<3.0",
    "python-jose[cryptography]>=3.3.0,<4.0",
    "bcrypt>=4.0.0,<6.0",
    "python-multipart>=0.0.9,<1.0",
    "redis[hiredis]>=5.0.0,<6.0",
    "boto3>=1.34.0,<2.0",
    "httpx>=0.27.0,<1.0",
    "python-dateutil>=2.9.0,<3.0",
    "structlog>=24.2.0,<25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0",
    "pytest-asyncio>=0.23.0,<2.0",
    "pytest-cov>=5.0.0,<7.0",
    "httpx>=0.27.0,<1.0",
    "ruff>=0.4.0,<1.0",
    "mypy>=1.10.0,<2.0",
    "faker>=25.0.0,<40.0",
    "aiosqlite>=0.20.0,<1.0",
    "moto[s3]>=5.0.0,<6.0",
    "pytest-timeout>=2.2.0,<3.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# E501: line too long (handled by formatter)
# UP042: StrEnum not compatible with SQLAlchemy Enum columns in all drivers
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --timeout=30"
markers = [
    "no_db: skip database setup/teardown (for tests that don't use the DB)",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]
