name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "デプロイ先環境"
        required: true
        default: "production"
        type: choice
        options:
          - production
      commit_sha:
        description: "デプロイするcommit（default: main）"
        required: false
        default: "main"
        type: string

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_DIR: ${{ secrets.PROD_DIR }}
    steps:
      - name: Check deployment secrets
        run: |
          if [[ -z "$PROD_HOST" || -z "$PROD_USER" || -z "$PROD_SSH_KEY" || -z "$PROD_DIR" ]]; then
            echo "❌ デプロイ用Secretsが未設定です。PROD_HOST/PROD_USER/PROD_SSH_KEY/PROD_DIR を設定してください。"
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Install SSH key
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
      - name: Run deploy script on target host
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=accept-new \
            "${PROD_USER}@${PROD_HOST}" \
            "cd ${PROD_DIR} && git fetch origin --tags && git checkout --detach '${{ inputs.commit_sha }}' && ./scripts/deploy.sh local '${{ inputs.commit_sha }}'"
      - name: Smoke test
        run: |
          HEALTH_URL="${HEALTH_URL:-https://$(echo $PROD_HOST | cut -d@ -f2)}/health"
          for i in $(seq 1 20); do
            if curl -sf "$HEALTH_URL" >/dev/null 2>&1; then echo "✅ /health OK"; exit 0; fi
            sleep 5
          done
          echo "❌ /health スモーク失敗" >&2
          exit 1
