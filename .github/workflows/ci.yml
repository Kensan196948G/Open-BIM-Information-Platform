name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff mypy
      - run: ruff check app tests ../scripts/seed_mvp.py
      - run: ruff format --check app tests ../scripts/seed_mvp.py
      - name: mypy
        # Production code only; test files are covered by ruff + pytest.
        run: mypy app
      - name: Build hardened backend image
        working-directory: .
        run: docker build -t open-bim-backend:ci backend
      - name: Verify backend runtime metadata
        working-directory: .
        run: |
          test "$(docker image inspect open-bim-backend:ci --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm open-bim-backend:ci python -c "import app.main"
          docker run --rm open-bim-backend:ci sh -c '! command -v pip'

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: bim_test
          POSTGRES_USER: bim_user
          POSTGRES_PASSWORD: bim_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: backend
    env:
      # App engine (used by /health) must point at the same Postgres service.
      DATABASE_URL: postgresql+asyncpg://bim_user:bim_password@localhost:5432/bim_test
      # Run the full backend suite against PostgreSQL so row locks, enums
      # and the immutable audit trigger are exercised in CI.
      TEST_DATABASE_URL: postgresql+asyncpg://bim_user:bim_password@localhost:5432/bim_test
      SECRET_KEY: test-secret-key
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=app --cov-report=xml -v
      - uses: codecov/codecov-action@v7
        if: always()
        with:
          files: backend/coverage.xml

  backend-audit:
    name: Backend Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]" pip-audit
      - run: pip install --upgrade "setuptools>=83.0.0"
      # PYSEC-2026-1325 (ecdsa/Minerva) has no fixed release and ecdsa is never
      # used at runtime (HS256/RS256 only) — ignored with documented justification.
      - run: pip-audit --ignore-vuln PYSEC-2026-1325

  sbom:
    name: Generate SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend metadata tooling
        working-directory: backend
        run: pip install pip-licenses
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save license-checker
      - name: Generate SBOM
        run: python3 scripts/sbom.py
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: SBOM.cyclonedx.json
          retention-days: 30

  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: npm audit (high+)
        run: npm audit --audit-level=high

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Build non-root frontend images
        working-directory: .
        run: |
          docker build -t open-bim-frontend:ci frontend
          docker build -f frontend/Dockerfile.demo -t open-bim-frontend-demo:ci frontend
      - name: Verify frontend runtime metadata
        run: |
          test "$(docker image inspect open-bim-frontend:ci --format '{{.Config.User}}')" = "1000:1000"
          test "$(docker image inspect open-bim-frontend-demo:ci --format '{{.Config.User}}')" = "101:101"
          docker image inspect open-bim-frontend:ci --format '{{json .Config.ExposedPorts}}' \
            | jq -e 'has("8080/tcp") and has("8443/tcp")'
          docker image inspect open-bim-frontend-demo:ci --format '{{json .Config.ExposedPorts}}' \
            | jq -e 'has("3000/tcp")'

  e2e:
    name: E2E (Playwright + live backend)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: bim_e2e
          POSTGRES_USER: bim_user
          POSTGRES_PASSWORD: bim_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://bim_user:bim_password@localhost:5432/bim_e2e
      SECRET_KEY: e2e-secret-key
      ENVIRONMENT: test
      CORS_ORIGINS: http://localhost:4173
      # E2E performs many logins from one IP; raise in-process limits for the test env.
      LOGIN_RATE_LIMIT: 10000
      REGISTER_RATE_LIMIT: 10000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Seed E2E data
        working-directory: backend
        run: python ../scripts/seed_e2e.py
      - name: Start backend
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then echo "backend up"; break; fi
            sleep 1
          done
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Resolve Playwright version
        id: playwright-version
        working-directory: frontend
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers
        working-directory: frontend
        # Retry to absorb transient CDN/network failures when downloading browser binaries.
        run: |
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Playwright install attempt ${attempt} failed; retrying in 10s..."
            sleep 10
          done
          echo "Playwright install failed after 3 attempts" >&2
          exit 1
      - name: Run E2E
        working-directory: frontend
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:4173
          VITE_API_BASE_URL: http://localhost:8000
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
