# Demo mode: frontend only (no backend/DB required)
# Usage: docker compose -f docker-compose.demo.yml up -d
version: "3.9"

services:
  frontend-demo:
    build:
      context: ./frontend
      dockerfile: Dockerfile.demo
    container_name: bim_frontend_demo
    environment:
      - VITE_MOCK_MODE=true
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "${DEMO_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  default:
    name: bim_demo_network
